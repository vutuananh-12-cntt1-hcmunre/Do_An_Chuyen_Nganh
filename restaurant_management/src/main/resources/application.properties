spring.application.name=restaurant_management

# Port chạy Backend
server.port=8080

# SQL Server Database
spring.datasource.url=jdbc:sqlserver://localhost:1433;databaseName=restaurant_management;encrypt=true;trustServerCertificate=true
spring.datasource.username=sa
spring.datasource.password=123
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver

# Spring Data JDBC
spring.sql.init.mode=never
# JWT Configuration
jwt.secret=RestaurantManagementProjectSecretKey2026MustBeAtLeast32Bytes
jwt.expiration=86400000
logging.level.org.springframework.security=DEBUG


# Hiển thị thông tin lỗi
spring.web.error.include-message=always
spring.web.error.include-binding-errors=always
spring.web.error.include-stacktrace=always

# Hiển thị log lỗi của ứng dụng
logging.level.root=INFO
logging.level.com.example.restaurant_management=DEBUG
logging.level.org.springframework.web=DEBUG
logging.level.org.springframework.jdbc=DEBUG


# VietQR Configuration
vietqr.bank-id=970436
vietqr.account-number=1041848273
vietqr.account-name=VU TUAN ANH
vietqr.template=qr_only
# Payment Webhook Configuration
payment.webhook.secret=restaurant_webhook_demo_2026_secure_key
# AI Service - FastAPI
ai.service.base-url=http://localhost:8000

app.upload.dir=uploads

spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
